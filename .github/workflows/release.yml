name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          if [ "${USE_CROSS}" = "true" ]; then
            cross build --release --target "${TARGET}"
          else
            cargo build --release --target "${TARGET}"
          fi

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/chatkeep-stage"
          rm -rf "${stage}"
          mkdir -p "${stage}" dist
          cp "target/${TARGET}/release/chatkeep" "${stage}/chatkeep"
          chmod 755 "${stage}/chatkeep"
          cp README.md LICENSE DISCLAIMER.md "${stage}/"
          export COPYFILE_DISABLE=1
          tar -czf "dist/chatkeep-${TARGET}.tar.gz" -C "${stage}" \
            chatkeep README.md LICENSE DISCLAIMER.md

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'chatkeep-stage'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\$env:TARGET\release\chatkeep.exe" (Join-Path $stage 'chatkeep.exe')
          Copy-Item README.md, LICENSE, DISCLAIMER.md -Destination $stage
          $archive = "dist\chatkeep-$env:TARGET.zip"
          if (Test-Path $archive) { Remove-Item -Force $archive }
          Compress-Archive -Path @(
            (Join-Path $stage 'chatkeep.exe'),
            (Join-Path $stage 'README.md'),
            (Join-Path $stage 'LICENSE'),
            (Join-Path $stage 'DISCLAIMER.md')
          ) -DestinationPath $archive

      - name: Upload archive
        uses: actions/upload-artifact@v6
        with:
          name: chatkeep-${{ matrix.target }}
          path: dist/chatkeep-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          expected=(
            chatkeep-aarch64-apple-darwin.tar.gz
            chatkeep-x86_64-apple-darwin.tar.gz
            chatkeep-x86_64-unknown-linux-gnu.tar.gz
            chatkeep-aarch64-unknown-linux-gnu.tar.gz
            chatkeep-x86_64-pc-windows-msvc.zip
          )
          for name in "${expected[@]}"; do
            if [ ! -f "${name}" ]; then
              echo "missing release asset: ${name}" >&2
              ls -la
              exit 1
            fi
          done
          sha256sum "${expected[@]}" | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          generate_release_notes: true
          files: |
            artifacts/chatkeep-aarch64-apple-darwin.tar.gz
            artifacts/chatkeep-x86_64-apple-darwin.tar.gz
            artifacts/chatkeep-x86_64-unknown-linux-gnu.tar.gz
            artifacts/chatkeep-aarch64-unknown-linux-gnu.tar.gz
            artifacts/chatkeep-x86_64-pc-windows-msvc.zip
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
