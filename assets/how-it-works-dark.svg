<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="How chatkeep mv works: it rewrites the local Cursor data that ties chats to a folder path">
  <title>How chatkeep mv works: it rewrites the local Cursor data that ties chats to a folder path</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B12"/><stop offset="1" stop-color="#0F1424"/>
