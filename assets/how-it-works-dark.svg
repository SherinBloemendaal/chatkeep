  <text x="94" y="203.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#9AA6BC">Cursor keyed the chats</text>
