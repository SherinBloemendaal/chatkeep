    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D9488"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="6" y1="6" x2="94" y2="94">
      <stop offset="0" stop-color="#0D9488"/><stop offset="0.5" stop-color="#0284C7"/><stop offset="1" stop-color="#7C3AED"/>
