<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Chatkeep: move the folder, keep the chats">
  <title>Chatkeep: move the folder, keep the chats</title>
  <defs>
